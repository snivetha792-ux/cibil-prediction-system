<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CIBIL Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef4ff, #dbe8ff);
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .register-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .login-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo">💳</div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Create your CIBIL Predictor account
            </p>

            {% if error %}
            <div class="error">
                {{ error }}
            </div>
            {% endif %}

            <form id="registerForm" method="POST" action="/register">

                <label>Full Name</label>

                <input type="text" name="name" id="name" placeholder="Enter your full name" required>

                <label>Email</label>

                <input type="email" name="email" id="email" placeholder="Enter your email" required>

                <label>Password</label>

                <input type="password" name="password" id="password" placeholder="Minimum 6 characters" required>

                <label>Confirm Password</label>

                <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>

                <button type="submit" class="register-btn">
                    Create Account
                </button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

    <script>

        document.getElementById("registerForm").addEventListener("submit", function (event) {

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 6) {

                event.preventDefault();

                alert("Password must be at least 6 characters.");

                return;
            }

            if (password !== confirmPassword) {

                event.preventDefault();

                alert("Passwords do not match.");

                return;
            }

        });

    </script>

</body>

</html>
