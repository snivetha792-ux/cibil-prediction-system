<!DOCTYPE html>
<html>
<head>
    <title>AI Risk Explanation</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f8ff;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 15px 0;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .factor {
            display: flex;
            justify-content: space-between;
            padding: 18px;
            margin: 10px 0;
            background: #f8faff;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🧠 AI Risk Explanation</h1>

    <div class="card">

        <h2>Why did the model predict this risk?</h2>

        <div class="factor">
            <span>Credit Utilization</span>
            <strong>78% - High</strong>
        </div>

        <div class="factor">
            <span>Delayed Payments</span>
            <strong>4 - High</strong>
        </div>

        <div class="factor">
            <span>Outstanding Debt</span>
            <strong>₹1,80,000 - High</strong>
        </div>

    </div>

</div>

</body>
</html>
