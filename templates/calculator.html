<!DOCTYPE html>
<html>

<head>
    <title>EMI Affordability Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 10px;
        }

        .result p {
            font-size: 17px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>EMI Affordability Calculator</h1>

        <label>Loan Amount (₹)</label>
        <input type="number" id="loanAmount" placeholder="Example: 500000">

        <label>Annual Interest Rate (%)</label>
        <input type="number" id="interestRate" step="0.1" placeholder="Example: 10">

        <label>Loan Tenure (Years)</label>
        <input type="number" id="tenure" placeholder="Example: 5">

        <label>Monthly Income (₹)</label>
        <input type="number" id="income" placeholder="Example: 40000">

        <button onclick="calculateEMI()">
            Calculate EMI
        </button>

        <div class="result" id="result">
            <p>Enter your loan details and calculate EMI.</p>
        </div>

    </div>

    <script>

        function calculateEMI() {

            const loanAmount =
                Number(document.getElementById("loanAmount").value);

            const annualRate =
                Number(document.getElementById("interestRate").value);

            const tenure =
                Number(document.getElementById("tenure").value);

            const income =
                Number(document.getElementById("income").value);

            if (loanAmount <= 0 || annualRate < 0 || tenure <= 0 || income <= 0) {
                alert("Please enter valid values.");
                return;
            }

            const monthlyRate = annualRate / 12 / 100;
            const months = tenure * 12;

            let emi;

            if (monthlyRate === 0) {
                emi = loanAmount / months;
            } else {
                emi =
                    loanAmount *
                    monthlyRate *
                    Math.pow(1 + monthlyRate, months) /
                    (Math.pow(1 + monthlyRate, months) - 1);
            }

            const totalPayment = emi * months;
            const totalInterest = totalPayment - loanAmount;

            const emiPercentage = (emi / income) * 100;

            let affordability;

            if (emiPercentage <= 40) {
                affordability = "Affordable";
            } else {
                affordability = "High EMI Burden";
            }

            document.getElementById("result").innerHTML = `

        <h2>EMI Result</h2>

        <p>
            <strong>Monthly EMI:</strong>
            ₹${emi.toFixed(2)}
        </p>

        <p>
            <strong>Total Interest:</strong>
            ₹${totalInterest.toFixed(2)}
        </p>

        <p>
            <strong>Total Payment:</strong>
            ₹${totalPayment.toFixed(2)}
        </p>

        <p>
            <strong>EMI / Income:</strong>
            ${emiPercentage.toFixed(2)}%
        </p>

        <p>
            <strong>Affordability:</strong>
            ${affordability}
        </p>
    `;
        }

    </script>

</body>

</html>
