<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CIBIL Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef4ff, #dbe8ff);
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 70px;
        }

        .show-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            border: none;
            background: transparent;
            color: #2563eb;
            cursor: pointer;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .register-text {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .register-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">💳</div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your CIBIL Prediction Dashboard
            </p>

            {% if error %}
            <div class="error">
                {{ error }}
            </div>
            {% endif %}

            <form id="loginForm" method="POST" action="/login">

                <label for="email">Email</label>

                <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                    required>

                <label for="password">Password</label>

                <div class="password-box">

                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required>

                    <button type="button" class="show-btn" id="showPassword">
                        Show
                    </button>

                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <p class="register-text">
                Don't have an account?
                <a href="/register">Create Account</a>
            </p>

        </div>

    </div>

    <script>

        const password = document.getElementById("password");
        const showPassword = document.getElementById("showPassword");

        showPassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";
                showPassword.textContent = "Hide";

            } else {

                password.type = "password";
                showPassword.textContent = "Show";

            }

        });


        document.getElementById("loginForm").addEventListener("submit", function (event) {

            const email = document.getElementById("email").value.trim();
            const passwordValue = document.getElementById("password").value;

            if (email === "" || passwordValue === "") {

                event.preventDefault();

                alert("Please enter email and password.");

            }

        });

    </script>

</body>

</html>
